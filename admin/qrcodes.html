<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07140f">
  <meta name="robots" content="noindex,nofollow">
  <title>QR Codes | MisArte Digital</title>
  <link rel="stylesheet" href="./css/admin.css?v=1.5.0">
  <link rel="stylesheet" href="./css/qrcodes.css?v=2.3.1">
</head>
<body class="dashboard-page">
  <div id="pageLoader" class="page-loader" aria-live="polite">
    <div class="loader-mark"></div><span>Validando acesso...</span>
  </div>

  <div id="dashboardApp" class="dashboard-app" hidden>
    <aside class="sidebar">
      <a class="sidebar-brand" href="./dashboard.html" aria-label="Painel MisArte Digital">
        <img src="./assets/misarte-monograma.png" alt="">
        <div><strong>MisArte Digital</strong><span>Painel Administrativo</span></div>
      </a>
      <nav class="sidebar-nav" aria-label="Navegação do painel">
        <a href="./dashboard.html"><span class="nav-icon">⌂</span>Visão geral</a>
        <a href="./dashboard.html#projetos"><span class="nav-icon">◇</span>Projetos</a>
        <a href="./clientes.html"><span class="nav-icon">◉</span>Clientes</a>
        <a class="active" href="./qrcodes.html"><span class="nav-icon">▦</span>QR Codes</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="user-chip">
          <span class="user-avatar">M</span>
          <div><strong>Mis</strong><small id="userEmail">Carregando...</small></div>
        </div>
        <button id="logoutButton" class="button button-ghost" type="button">Sair</button>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-header qr-header">
        <button id="menuButton" class="mobile-menu-button" type="button" aria-label="Abrir menu">☰</button>
        <div>
          <p class="eyebrow">GESTÃO MIsARTE</p>
          <h1>QR Codes</h1>
          <p>Gere, organize e baixe os QR Codes dos clientes.</p>
        </div>
        <button id="newQrButton" class="button button-primary header-action" type="button">+ Novo QR Code</button>
      </header>

      <section class="qr-summary" aria-label="Resumo">
        <article><span>Total</span><strong id="qrTotal">—</strong></article>
        <article><span>Ativos</span><strong id="qrActive">—</strong></article>
        <article><span>Arquivados</span><strong id="qrArchived">—</strong></article>
      </section>

      <section class="qr-toolbar" aria-label="Filtros">
        <label class="qr-search">
          <span>Buscar</span>
          <input id="searchInput" type="search" placeholder="Nome, cliente, código ou tipo">
        </label>
        <label>
          <span>Status</span>
          <select id="statusFilter">
            <option value="">Todos</option>
            <option value="ativo">Ativos</option>
            <option value="inativo">Inativos</option>
            <option value="arquivado">Arquivados</option>
          </select>
        </label>
        <label>
          <span>Tipo</span>
          <select id="typeFilter">
            <option value="">Todos</option>
            <option value="cardapio">Cardápio</option>
            <option value="instagram">Instagram</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="site">Site</option>
            <option value="google_maps">Google Maps</option>
            <option value="personalizado">Personalizado</option>
          </select>
        </label>
      </section>

      <section class="panel-section">
        <div id="qrState" class="projects-state table-card">Carregando QR Codes...</div>
        <div id="qrGrid" class="qr-grid" hidden></div>
      </section>
    </main>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="qrDrawer" class="client-drawer" aria-hidden="true" aria-labelledby="drawerTitle">
    <div class="drawer-header">
      <div><p class="eyebrow">QR CODE</p><h2 id="drawerTitle">Novo QR Code</h2></div>
      <button id="closeDrawerButton" class="icon-button" type="button" aria-label="Fechar">×</button>
    </div>

    <form id="qrForm" class="client-form">
      <input id="qrId" type="hidden">
      <div class="form-grid">
        <label class="full-field">
          <span>Nome *</span>
          <input id="qrName" required maxlength="120" placeholder="Ex.: QR Cardápio Principal">
        </label>
        <label class="full-field">
          <span>Cliente *</span>
          <select id="qrClient" required><option value="">Carregando clientes...</option></select>
        </label>
        <label>
          <span>Tipo *</span>
          <select id="qrType" required>
            <option value="cardapio">Cardápio</option>
            <option value="instagram">Instagram</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="site">Site</option>
            <option value="google_maps">Google Maps</option>
            <option value="personalizado">Personalizado</option>
          </select>
        </label>
        <label>
          <span>Status *</span>
          <select id="qrStatus" required>
            <option value="ativo">Ativo</option>
            <option value="inativo">Inativo</option>
          </select>
        </label>
        <label class="full-field">
          <span>URL de destino *</span>
          <input id="qrUrl" type="url" required maxlength="2000" placeholder="https://...">
          <small>Use a URL completa, começando por https://</small>
        </label>
        <label class="full-field">
          <span>Observações</span>
          <textarea id="qrNotes" rows="4" maxlength="500" placeholder="Informação interna opcional"></textarea>
        </label>
      </div>
      <p id="formMessage" class="form-message" aria-live="polite"></p>
      <div class="drawer-actions">
        <button id="cancelButton" class="button button-secondary" type="button">Cancelar</button>
        <button id="saveButton" class="button button-primary" type="submit">Gerar QR Code</button>
      </div>
    </form>
  </aside>

  <div id="previewModal" class="qr-modal" hidden>
    <div class="qr-modal-card" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <button id="closePreviewButton" class="icon-button qr-modal-close" type="button" aria-label="Fechar">×</button>
      <p class="eyebrow">VISUALIZAÇÃO</p>
      <h2 id="previewTitle">QR Code</h2>
      <p id="previewMeta" class="qr-preview-meta"></p>
      <div id="previewCanvas" class="qr-preview-canvas"></div>
      <p id="previewUrl" class="qr-preview-url"></p>
      <button id="downloadPreviewButton" class="button button-primary" type="button">Baixar PNG</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="./js/supabase.js?v=1.0.0"></script>
  <script src="./js/qrcodes.js?v=2.3.1"></script>
</body>
</html>
